<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Eitmam Omar Sanam</title>
    <script type="text/javascript">
      // GitHub Pages has no real server-side routing. This redirects any
      // unmatched deep link (e.g. /portfolio/projects/xyz) back to index.html
      // with the real path encoded, so React Router can restore it client-side.
      // Keep in sync with the decode script in index.html.
      var pathSegmentsToKeep = 1; // keep "/portfolio"
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
